<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#180e15" />
      <stop offset="100%" stop-color="#080306" />
    </radialGradient>
    <radialGradient id="ruby" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>
    <!-- Exact Site Antique Gold Palette (#c49a6c) -->
    <linearGradient id="siteGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0b584" />
      <stop offset="50%" stop-color="#c49a6c" />
      <stop offset="100%" stop-color="#8a6843" />
    </linearGradient>
  </defs>

  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="236" fill="url(#bg)" stroke="url(#siteGold)" stroke-width="20" />
  
  <!-- Outer Dashed Astrolabe Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#fb7185" stroke-width="5" stroke-dasharray="14 10" opacity="0.75" />

  <!-- Inner Rotated Squares -->
  <rect x="136" y="136" width="240" height="240" fill="none" stroke="url(#siteGold)" stroke-width="7" transform="rotate(45 256 256)" opacity="0.85" />
  <rect x="156" y="156" width="200" height="200" fill="none" stroke="#fb7185" stroke-width="5" transform="rotate(15 256 256)" opacity="0.65" />

  <!-- Central 4-Pointed Star -->
  <path d="M256 70 L305 211 L446 256 L305 301 L256 442 L207 301 L66 256 L207 211 Z" fill="url(#ruby)" stroke="#fff" stroke-width="5" />
  
  <!-- Center White Star Core -->
  <polygon points="256,180 274,238 332,256 274,274 256,332 238,274 180,256 238,238" fill="#ffffff" />
</svg>